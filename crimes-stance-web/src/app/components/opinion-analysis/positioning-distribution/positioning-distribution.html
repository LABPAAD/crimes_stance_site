<div class="bg-white rounded-lg shadow-sm border border-slate-200 p-6 h-full flex flex-col">
  <h3 class="text-lg font-semibold text-slate-900 mb-6 flex items-center gap-2">
    <i class="bi bi-bar-chart-steps text-blue-500"></i>
    Distribuição de Posicionamentos
  </h3>
  
  <div class="space-y-6 flex-grow flex flex-col justify-center">
    <!-- Aprovação -->
    <div class="flex flex-col gap-2">
      <div class="flex items-center justify-between text-sm">
        <div class="flex items-center gap-2 font-medium text-slate-700">
          <div class="w-3 h-3 bg-emerald-500 rounded-full"></div>
          Aprovação
        </div>
        <span class="text-slate-500">{{ formatNumber(counts['1'] || 0) }} comentários</span>
      </div>
      <div class="flex items-center gap-3">
        <div class="flex-grow bg-slate-100 rounded-full h-2.5 overflow-hidden">
          <div class="bg-emerald-500 h-full rounded-full transition-all duration-500" [style.width.%]="percentages.positive"></div>
        </div>
        <span class="text-sm font-bold text-slate-900 w-10 text-right">{{ percentages.positive }}%</span>
      </div>
    </div>

    <!-- Desaprovação -->
    <div class="flex flex-col gap-2">
      <div class="flex items-center justify-between text-sm">
        <div class="flex items-center gap-2 font-medium text-slate-700">
          <div class="w-3 h-3 bg-rose-500 rounded-full"></div>
          Desaprovação
        </div>
        <span class="text-slate-500">{{ formatNumber(counts['-1'] || 0) }} comentários</span>
      </div>
      <div class="flex items-center gap-3">
        <div class="flex-grow bg-slate-100 rounded-full h-2.5 overflow-hidden">
          <div class="bg-rose-500 h-full rounded-full transition-all duration-500" [style.width.%]="percentages.negative"></div>
        </div>
        <span class="text-sm font-bold text-slate-900 w-10 text-right">{{ percentages.negative }}%</span>
      </div>
    </div>

    <!-- Neutro -->
    <div class="flex flex-col gap-2">
      <div class="flex items-center justify-between text-sm">
        <div class="flex items-center gap-2 font-medium text-slate-700">
          <div class="w-3 h-3 bg-slate-400 rounded-full"></div>
          Neutro
        </div>
        <span class="text-slate-500">{{ formatNumber(counts['0'] || 0) }} comentários</span>
      </div>
      <div class="flex items-center gap-3">
        <div class="flex-grow bg-slate-100 rounded-full h-2.5 overflow-hidden">
          <div class="bg-slate-400 h-full rounded-full transition-all duration-500" [style.width.%]="percentages.neutral"></div>
        </div>
        <span class="text-sm font-bold text-slate-900 w-10 text-right">{{ percentages.neutral }}%</span>
      </div>
    </div>
  </div>
</div>
